name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m py_compile server.py overlay_store.py overlay_components.py topic_store.py
      - run: node --check static/overlay-components.js && node --check static/overlays.js && node --check static/topics.js
      - run: python -m unittest discover tests
