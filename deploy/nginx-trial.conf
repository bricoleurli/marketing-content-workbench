# Replace workbench.example.com with the deployment hostname.
# Anonymous shared trial: never attach private media to this instance.
server {
    listen 80;
    server_name workbench.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/marketing-workbench-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name workbench.example.com;
    ssl_certificate /etc/letsencrypt/live/workbench.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = / { return 302 /overlays; }
    # Keep private topics and global paid-API configuration internal.
    location = /topics-data.js {
        default_type application/javascript;
        return 200 'window.WORKBENCH_TOPICS = { categories: [] };';
    }
    location = /api/config {
        default_type application/json;
        return 200 '{"keyConfigured":false,"keySource":"trial","voices":[],"history":[]}';
    }
    location ~ ^/api/(settings|generate)/?$ {
        default_type application/json;
        return 403 '{"error":"Public trial: voice API configuration and paid generation are disabled."}';
    }
    location / {
        proxy_pass http://127.0.0.1:8876;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
